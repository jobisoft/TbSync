# Keeps latest.xpi on exactly one release - the one GitHub calls Latest - so
# this URL can be pinned by enterprise policies as install_url:
#
#   https://github.com/<owner>/<repo>/releases/latest/download/latest.xpi
#
# latest.yaml is published beside it, naming the version, byte size and
# download URL of that xpi, so a deployment can read what it is about to
# install without downloading it:
#
#   https://github.com/<owner>/<repo>/releases/latest/download/latest.yaml
#
# This workflow has one job: make the alias follow the Latest designation,
# wherever that is. It never moves the designation itself - `promote.yml`
# does that, and everything else is a person clicking "Set as the latest
# release". Either way this runs afterwards and catches up.
#
# There is no release event for "was made Latest", and the payload carries
# no field saying so. Setting it on an already-published release is an
# `edited`, so this listens for the three types that can leave a different
# release holding it - and then ignores which one raised the event.
#
# It does not work out what changed. It reconciles: one listing says
# whether the latest release holds the whole alias and nothing else holds
# any of it. If so the run is over. If not, the alias comes off every
# release and a freshly built one goes onto the latest.
#
# Both halves of that condition earn their place. Without the first, an
# edit to any release rebuilds an alias that was already right. Without the
# second, a run that died half way through leaves a duplicate that no later
# run will ever clear.
#
# A pre-release skips even that. One cannot hold Latest, so nothing it does
# can matter here, and betas are published far more often than promoted.
#
# Run by hand and it does the same reconciliation, so a manual run is a
# genuine repair rather than a second code path that can disagree with the
# first - and it is the way to fix the state by hand after anything unusual.
#
# The versioned asset is never touched and stays the visible one.

name: latest.xpi

on:
  release:
    types: [published, edited, released]
  workflow_dispatch:

permissions:
  contents: write

# Never cancel: a run that dies between the upload and the cleanup leaves the
# alias on two releases, or on none. Queue instead - each run is seconds.
concurrency:
  group: latest-xpi
  cancel-in-progress: false

jobs:
  alias:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Put latest.xpi on the release that holds Latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          EVENT_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail

          # A pre-release cannot hold Latest, so nothing it does can matter
          # here. Answered without asking anybody, and it is most events.
          if [ "${EVENT_PRERELEASE:-}" = "true" ]; then
            echo "$EVENT_TAG is a pre-release; Latest cannot have moved."
            exit 0
          fi

          # Everything else reconciles the whole repository rather than
          # working out what changed: the alias comes off every release, then
          # a freshly built one goes onto the latest. Deciding first would
          # save a few seconds and cost the only thing that clears up after a
          # run that died half way - a run that concludes it has nothing to
          # do cannot remove a duplicate.
          latest=$(gh api "repos/$GH_REPO/releases/latest")
          TAG=$(printf '%s' "$latest" | jq -r .tag_name)

          name=$(printf '%s' "$latest" \
                 | jq -r '[.assets[].name | select(endswith("_beta.xpi"))] | first // empty')
          if [ -z "$name" ]; then
            echo "::error::$TAG carries no *_beta.xpi to copy."
            exit 1
          fi
          echo "Latest is $TAG ($name)."

          # One listing answers both questions: is anything holding the
          # alias that should not be, and does the latest release hold all
          # of it? Cheap, because the removal below needs this list anyway.
          releases=$(gh api --paginate "repos/$GH_REPO/releases")
          stale=$(printf '%s' "$releases" \
                  | jq -r --arg tag "$TAG" '.[] | select(.tag_name != $tag) | .assets[]
                      | select(.name == "latest.xpi" or .name == "latest.yaml") | .id')
          mine=$(printf '%s' "$releases" \
                 | jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag)
                     | [.assets[].name | select(. == "latest.xpi" or . == "latest.yaml")]
                     | sort | join(",")')

          if [ -z "$stale" ] && [ "$mine" = "latest.xpi,latest.yaml" ]; then
            echo "$TAG already carries the alias, and nothing else does."
            exit 0
          fi

          # 1. Off every release, the latest one included, so what follows
          #    starts from a known state instead of a guessed one.
          #
          #    Order costs nothing where it counts. When the designation has
          #    just moved, the pinned
          #    releases/latest/download/latest.xpi already resolves to the
          #    new release - which has no alias yet - so the gap is open from
          #    the moment the label moved, whichever end this does first.
          printf '%s' "$releases" \
            | jq -r '.[] | .assets[]
                         | select(.name == "latest.xpi" or .name == "latest.yaml") | .id' \
            | while read -r asset_id; do
                echo "removing alias (asset $asset_id)"
                gh api -X DELETE "repos/$GH_REPO/releases/assets/$asset_id"
              done

          # 2. Then onto the latest release: latest.xpi beside the versioned
          #    asset it copies, and latest.yaml describing it. The version is
          #    read out of the xpi rather than taken from the tag, so it
          #    states what is served.
          mkdir -p out
          gh release download "$TAG" --pattern "$name" --dir out
          mv "out/$name" out/latest.xpi

          version=$(unzip -p out/latest.xpi manifest.json | jq -r .version)
          size=$(stat -c%s out/latest.xpi)
          url="https://github.com/$GH_REPO/releases/latest/download/latest.xpi"
          printf 'version: "%s"\nsize: %s\nurl: "%s"\n' "$version" "$size" "$url" \
            > out/latest.yaml
          cat out/latest.yaml

          gh release upload "$TAG" out/latest.xpi out/latest.yaml --clobber

          echo "$TAG carries latest.xpi + latest.yaml and is the public release."
